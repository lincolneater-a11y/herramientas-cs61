<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
<defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FFFEFC"/><stop offset="1" stop-color="#FAF3E9"/></linearGradient></defs>
<rect width="1200" height="650" rx="44" fill="url(#paper)"/>
<rect x="32" y="28" width="1136" height="94" rx="35" fill="#2A9D8F"/>
<text x="600" y="91" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="39" font-weight="bold" fill="white">Estómago del recién nacido y lactancia</text>
<rect x="34" y="148" width="480" height="435" rx="32" fill="#E8F4F0"/>
<text x="274" y="195" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="27" font-weight="bold" fill="#255E59">El estómago va creciendo</text>
<!-- schematic abstract stomach silhouette no volumes -->
<path d="M242 242 C243 281 237 301 214 320 C178 347 180 407 220 446 C272 494 361 469 373 403 C381 361 362 330 326 320 C291 312 275 277 278 241" fill="#F4A261" stroke="#C87944" stroke-width="9" stroke-linecap="round"/>
<path d="M257 250 C257 308 237 334 218 361" stroke="#FFD9AA" fill="none" stroke-width="12" stroke-linecap="round"/>
<text x="274" y="532" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="#273142">Es pequeño al nacer,</text>
<text x="274" y="560" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="21" fill="#273142">pero su capacidad varía.</text>
<rect x="548" y="148" width="620" height="435" rx="32" fill="#FCEBE6"/>
<text x="590" y="202" font-family="DejaVu Sans, Arial" font-size="27" font-weight="bold" fill="#7D4242">En vez de comparar con frutas:</text>
<g font-family="DejaVu Sans, Arial" font-size="24" fill="#273142">
 <circle cx="594" cy="259" r="16" fill="#2A9D8F"/><path d="M586 259 l7 8 l14 -17" fill="none" stroke="white" stroke-width="5"/>
 <text x="625" y="266">Ofrecer el pecho ante señales de hambre.</text>
 <circle cx="594" cy="333" r="16" fill="#2A9D8F"/><path d="M586 333 l7 8 l14 -17" fill="none" stroke="white" stroke-width="5"/>
 <text x="625" y="340">Observar succión y deglución eficaces.</text>
 <circle cx="594" cy="407" r="16" fill="#2A9D8F"/><path d="M586 407 l7 8 l14 -17" fill="none" stroke="white" stroke-width="5"/>
 <text x="625" y="414">Controlar pañales y evolución del peso.</text>
</g>
<rect x="565" y="468" width="583" height="87" rx="18" fill="#FFFDF9"/>
<text x="856" y="502" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="19" font-weight="bold" fill="#8C5250">Las equivalencias con cereza, nuez o huevo</text>
<text x="856" y="529" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="19" fill="#8C5250">no son mediciones exactas para cada bebé.</text>
<text x="600" y="622" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="18" fill="#737C84">Recurso educativo: no reemplaza el seguimiento del equipo de salud.</text>
</svg>