<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F9FCFC"/><stop offset="1" stop-color="#E9F5F2"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3B08B"/><stop offset="1" stop-color="#DD956C"/></linearGradient>
</defs>
<rect width="600" height="600" fill="#FFFDF9"/>
<ellipse cx="302" cy="295" rx="283" ry="254" fill="url(#bg)"/>
<!-- seat and mother: 3/4 overhead anatomical teaching perspective -->
<rect x="123" y="141" width="274" height="370" rx="96" fill="#9ED2CC" stroke="#3D9E96" stroke-width="7"/>
<path d="M149 378 Q132 454 166 504 L390 504 Q420 451 389 376" fill="#8E72A8"/>
<!-- mother's torso; sitting facing viewer; baby lives to HER right, viewer-right -->
<path d="M192 244 Q158 263 165 367 Q169 435 218 484 L348 483 Q375 423 356 345 Q354 264 307 243" fill="#E46E7D" stroke="#A44965" stroke-width="7"/>
<!-- neck -->
<path d="M233 211 L232 260 Q269 281 305 256 L300 211Z" fill="url(#skin)"/>
<!-- hair -->
<path d="M209 196 Q173 170 183 111 Q193 55 249 66 Q284 46 323 83 Q365 132 334 197 Q324 218 296 229 L233 229Z" fill="#5D3529" stroke="#492820" stroke-width="7"/>
<!-- face -->
<ellipse cx="262" cy="157" rx="68" ry="80" fill="url(#skin)" stroke="#A46F4C" stroke-width="3"/>
<path d="M229 163 q16 12 31 0 M279 165 q12 8 22 -2" fill="none" stroke="#4E302B" stroke-width="4" stroke-linecap="round"/>
<path d="M256 202 q15 11 29 -5" fill="none" stroke="#9A494B" stroke-width="4" stroke-linecap="round"/>
<path d="M191 141 Q190 92 227 80 Q293 67 322 111 Q308 91 281 95 Q237 105 210 147" fill="#5D3529"/>
<!-- torso neckline and breast at viewer RIGHT -->
<path d="M201 264 Q241 296 275 305 Q310 281 338 269" fill="none" stroke="#F7D4D3" stroke-width="9"/>
<ellipse cx="332" cy="336" rx="31" ry="40" fill="url(#skin)" stroke="#BA7659" stroke-width="3"/>
<!-- side cushion on RIGHT, behind arm; never across abdomen -->
<path d="M365 333 Q407 306 514 330 Q554 347 544 416 Q516 443 414 424 Q376 415 355 399Z" fill="#B9D9AA" stroke="#6DA78C" stroke-width="6"/>
<!-- baby legs are farthest to the right toward mother's back -->
<path d="M430 354 Q463 332 495 345 Q518 352 512 371 Q504 384 479 381 L457 393" fill="#E8A77C" stroke="#AD734F" stroke-width="5"/>
<ellipse cx="514" cy="370" rx="14" ry="11" fill="#EAA77F"/>
<path d="M444 367 Q480 371 507 394" fill="none" stroke="#E8A77C" stroke-width="18" stroke-linecap="round"/>
<ellipse cx="515" cy="400" rx="15" ry="11" fill="#E8A77C"/>
<!-- baby torso along side, NOT over maternal belly -->
<path d="M382 318 Q414 306 450 330 Q466 351 451 391 Q424 407 379 390 Q365 375 368 349Z" fill="#7CC5E5" stroke="#3E8EBA" stroke-width="6"/>
<path d="M414 322 Q432 331 436 347" stroke="#D5F1FB" stroke-width="8" stroke-linecap="round"/>
<!-- mother's right arm hooked AROUND the baby, with palm at neck/shoulders; underarm hold -->
<path d="M349 278 Q426 294 457 342 Q472 381 425 399 Q395 406 375 378" fill="none" stroke="#A67152" stroke-width="30" stroke-linecap="round"/>
<path d="M349 278 Q426 294 457 342 Q472 381 425 399 Q395 406 375 378" fill="none" stroke="#E9A37D" stroke-width="24" stroke-linecap="round"/>
<!-- newborn head next to offered breast, facing inward -->
<ellipse cx="359" cy="348" rx="42" ry="44" fill="#E9AD89" stroke="#9D7059" stroke-width="4"/>
<path d="M325 339 Q328 305 353 303 Q382 302 398 327 Q366 319 347 326 Q339 330 325 339" fill="#7B4833"/>
<path d="M327 350 q-8 1 -10 6" stroke="#93593E" stroke-width="4" fill="none"/>
<circle cx="341" cy="348" r="3.5" fill="#3D312D"/>
<path d="M323 361 q7 5 12 0" stroke="#AE6A62" stroke-width="3" fill="none"/>
<!-- hand behind shoulders, not pressure on occiput -->
<ellipse cx="376" cy="375" rx="29" ry="17" transform="rotate(-20 376 375)" fill="#EFB08B" stroke="#B77F60" stroke-width="3"/>
<!-- elbow/arm creates enclosing underarm loop -->
<!-- little side directional hint, purely decorative arrow -->
<path d="M465 281 Q506 267 538 287" fill="none" stroke="#389E97" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 9"/>
<path d="M525 270 L542 288 L517 299" fill="none" stroke="#389E97" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>